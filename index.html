<style>
  details {
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 10px;
    width: 300px;
    font-family: sans-serif;
  }

  summary {
    font-weight: bold;
    cursor: pointer;
    list-style: none; 
  }

  
  summary::after {
    content: '+';
    float: right;
  }

  details[open] summary::after {
    content: '-';
  }

  details p {
    margin-top: 10px;
    color: #555;
  }
</style>
